<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 | Builder Field Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap');

        :root {
            --ui-bg: #0A110E;
            --ui-surface: rgba(15, 41, 34, 0.4);
            --ui-border: rgba(46, 92, 72, 0.5);
            --accent-yellow: #FFD166;
            --accent-coral: #FF5A5F;
            --accent-green: #06D6A0;
            --text-light: #F6F4E8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--ui-bg);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 214, 160, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 90, 95, 0.03) 0%, transparent 50%);
            min-height: 100vh;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Technical Grid Background */
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px), 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--ui-bg); }
        ::-webkit-scrollbar-thumb { background: #1F3F30; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-coral); }

        .glass-panel {
            background: var(--ui-surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--ui-border);
        }

        /* Form Controls */
        .form-input {
            width: 100%;
            background: rgba(10, 17, 14, 0.8);
            border: 1px solid var(--ui-border);
            border-radius: 0.5rem;
            padding: 0.875rem 1rem;
            color: var(--text-light);
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 1px var(--accent-yellow);
        }
        .form-input::placeholder { color: rgba(246, 244, 232, 0.3); }

        /* Toast Animation */
        @keyframes toastSlide {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, 20px); }
        }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
        }
        #toast.show {
            display: flex;
            animation: toastSlide 4s ease-in-out forwards;
        }
        .hidden-force { display: none !important; }
    </style>
</head>
<body class="selection:bg-[var(--accent-coral)] selection:text-white pb-16">

    <div class="bg-grid"></div>

    <!-- Toast Notification -->
    <div id="toast" class="bg-[#1F3F30] text-[#06D6A0] border border-[#06D6A0]/30 px-6 py-4 rounded-xl font-bold shadow-2xl items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        <span id="toast-msg" class="text-sm">Action successful!</span>
    </div>

    <div class="max-w-[1300px] mx-auto px-4 md:px-6 py-8 relative z-10">
        
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tight uppercase flex items-center gap-3">
                    HH GOA 2026
                    <span class="bg-[#0F2922] text-[#06D6A0] text-[10px] font-mono px-2 py-1 rounded border border-[#06D6A0]/30">HACKER HOUSE</span>
                </h1>
                <div class="flex items-center gap-3 mt-2">
                    <span class="text-[#F6F4E8]/60 font-mono text-xs tracking-widest font-bold">BUILDER EDITION</span>
                    <span class="text-[#F6F4E8]/20 text-xs">•</span>
                    <span class="text-[#FFD166] font-mono text-xs tracking-widest font-bold">FIELD CARD</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2 bg-[#0A110E] border border-[#1F3F30] px-4 py-2 rounded-lg">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#FF5A5F] opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-[#FF5A5F]"></span>
                </span>
                <span class="text-[10px] font-bold font-mono tracking-widest text-[#F6F4E8]/80">LIVE PREVIEW</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT PANEL: CONFIGURATION -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel rounded-2xl p-6 md:p-8 shadow-2xl">
                    <form id="generator-form" class="space-y-6" onsubmit="event.preventDefault();">
                        
                        <!-- Photo Upload -->
                        <div class="space-y-2">
                            <label class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Profile Image</label>
                            
                            <label id="upload-zone" tabindex="0" class="flex flex-col items-center justify-center w-full h-48 border border-[#1F3F30] border-dashed rounded-xl cursor-pointer bg-[#0A110E]/60 hover:bg-[#1F3F30]/30 hover:border-[#FFD166] transition-all group overflow-hidden relative focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFD166]">
                                
                                <div id="upload-placeholder" class="flex flex-col items-center justify-center text-center p-4 w-full h-full">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#06D6A0] mb-3 group-hover:scale-110 transition-transform"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                                    <p class="text-xs font-bold text-[#F6F4E8] tracking-wide mb-1">UPLOAD BUILDER PHOTO</p>
                                    <p class="text-[11px] text-[#F6F4E8]/40 mb-3 font-mono">Drop image or click to browse</p>
                                </div>

                                <img id="ui-photo-preview" class="absolute inset-0 w-full h-full object-cover hidden-force" alt="Uploaded photo" />
                                
                                <div id="ui-photo-overlay" class="absolute inset-0 bg-[#0A110E]/80 flex flex-col items-center justify-center hidden-force opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
                                    <span class="text-[#FFD166] text-xs font-bold tracking-widest font-mono border border-[#FFD166]/50 px-3 py-1.5 rounded">REPLACE PHOTO</span>
                                </div>
                                
                                <input type="file" id="image-upload" class="hidden" accept="image/png, image/jpeg, image/jpg, image/webp, image/heic" />
                            </label>
                        </div>

                        <!-- Name -->
                        <div class="space-y-2">
                            <label for="name-input" class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Full Name</label>
                            <input type="text" id="name-input" maxlength="20" placeholder="e.g. SWAPNIL" class="form-input" />
                        </div>

                        <!-- Role -->
                        <div class="space-y-2">
                            <label for="role-input" class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Primary Role</label>
                            <input type="text" id="role-input" maxlength="25" placeholder="e.g. AI / ML BUILDER" class="form-input" />
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <!-- Stack -->
                            <div class="space-y-2">
                                <label for="stack-input" class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Tech Stack</label>
                                <input type="text" id="stack-input" maxlength="22" placeholder="AI • WEB • PYTHON" class="form-input" />
                            </div>

                            <!-- Building -->
                            <div class="space-y-2">
                                <label for="building-input" class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Building</label>
                                <input type="text" id="building-input" maxlength="15" placeholder="PRODUCTS" class="form-input" />
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="space-y-2">
                            <label for="status-input" class="block text-[10px] font-bold text-[#F6F4E8]/60 uppercase tracking-widest font-mono">Status</label>
                            <div class="relative">
                                <select id="status-input" class="form-input appearance-none cursor-pointer text-[#FFD166]">
                                    <option value="READY TO SHIP">READY TO SHIP</option>
                                    <option value="BUILDING CORE">BUILDING CORE</option>
                                    <option value="DEBUGGING">DEBUGGING</option>
                                    <option value="IN THE ZONE">IN THE ZONE</option>
                                    <option value="DEPLOYING">DEPLOYING</option>
                                </select>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#F6F4E8]/40 pointer-events-none"><path d="m6 9 6 6 6-6"/></svg>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RIGHT PANEL: PREVIEW & ACTIONS -->
            <div class="lg:col-span-7 flex flex-col space-y-6">
                
                <!-- Hidden Canvas -->
                <canvas id="render-canvas" class="hidden-force"></canvas>

                <!-- LIVE PREVIEW CONTAINER -->
                <div class="glass-panel rounded-2xl flex flex-col overflow-hidden relative shadow-2xl flex-1 min-h-[550px] p-6 lg:p-8 flex items-center justify-center">
                    
                    <!-- EMPTY STATE -->
                    <div id="state-empty" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center z-0">
                        <div class="mb-6 relative">
                            <!-- Technical SVG Deco -->
                            <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="30" y="30" width="60" height="60" rx="10" stroke="#06D6A0" stroke-width="2" stroke-dasharray="4 4"/>
                                <path d="M15 60H25M95 60H105M60 15V25M60 95V105" stroke="#FFD166" stroke-width="2"/>
                                <circle cx="60" cy="60" r="15" fill="#1F3F30"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-black text-[#F6F4E8] mb-2 uppercase tracking-wide">Create Your Builder Field Card</h2>
                        <p class="text-[#F6F4E8]/50 text-sm font-mono max-w-xs mb-8">Your builder identity.<br>Your photo.<br>Your story.</p>
                        <button type="button" onclick="document.getElementById('image-upload').click()" class="bg-white hover:bg-gray-200 text-black px-6 py-3 rounded font-bold font-mono text-sm transition-colors flex items-center gap-2">
                            UPLOAD PHOTO
                        </button>
                    </div>

                    <!-- SUCCESS STATE (Generated Image) -->
                    <div id="state-success" class="w-full max-w-[440px] relative z-10 hidden-force">
                        <img id="preview-img" src="" alt="HH Goa Builder Field Card" class="w-full h-auto shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-[#F6F4E8]/5" />
                    </div>
                </div>

                <!-- ACTIONS PANEL -->
                <div id="actions-panel" class="glass-panel rounded-2xl p-6 opacity-40 pointer-events-none transition-opacity duration-300">
                    
                    <div class="flex items-center justify-between mb-5">
                        <h3 class="text-xs font-bold text-[#F6F4E8]/60 font-mono tracking-widest uppercase">Export & Share</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                        <!-- Primary: Download -->
                        <button id="btn-download" class="py-3.5 px-6 bg-[#06D6A0] hover:bg-[#05b889] text-[#0A110E] font-black rounded-lg text-sm flex items-center justify-center gap-2 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            DOWNLOAD PNG
                        </button>
                        
                        <!-- Secondary: Share on X -->
                        <button id="btn-share-x" class="py-3.5 px-6 bg-white hover:bg-gray-200 text-black font-black rounded-lg text-sm flex items-center justify-center gap-2 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                            SHARE ON 𝕏
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- Other: Copy Image -->
                        <button id="btn-copy" class="py-3 px-4 bg-transparent border border-[#1F3F30] hover:bg-[#1F3F30]/50 text-[#F6F4E8] font-bold rounded-lg text-xs font-mono flex items-center justify-center gap-2 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            COPY IMAGE
                        </button>

                        <!-- Other: Start Over -->
                        <button id="btn-restart" class="py-3 px-4 bg-transparent border border-[#FF5A5F]/30 hover:bg-[#FF5A5F]/10 text-[#FF5A5F] font-bold rounded-lg text-xs font-mono flex items-center justify-center gap-2 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            START OVER
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const randomIdHash = Math.floor(Math.random() * 9000 + 1000); // 4 digit hash
        
        let state = {
            imageSrc: null,
            name: 'SWAPNIL',
            role: 'AI / ML BUILDER',
            stack: 'AI • WEB • PYTHON',
            building: 'PRODUCTS',
            status: 'READY TO SHIP',
            previewUrl: '',
            get builderId() {
                const init = (this.name || 'XX').replace(/[^a-zA-Z]/g, '').substring(0, 4).toUpperCase();
                return `HH26-${init}-${randomIdHash}`;
            }
        };

        const SHARE_TEXT = `🚀 I'm excited to join HH Goa 2026!\n\nJust created my HH Goa 2026 Builder Field Card.\n\nBuild • Ship • Repeat.\n\nCreate your own:\nhttps://hhgoa2026.niat.tech/\n\n#FrameInGoa #HHGoa2026`;

        // --- DOM Elements ---
        const imageUpload = document.getElementById('image-upload');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const uiPhotoPreview = document.getElementById('ui-photo-preview');
        const uiPhotoOverlay = document.getElementById('ui-photo-overlay');
        
        const nameInput = document.getElementById('name-input');
        const roleInput = document.getElementById('role-input');
        const stackInput = document.getElementById('stack-input');
        const buildingInput = document.getElementById('building-input');
        const statusInput = document.getElementById('status-input');
        
        const stateEmpty = document.getElementById('state-empty');
        const stateSuccess = document.getElementById('state-success');
        const actionsPanel = document.getElementById('actions-panel');
        
        const canvas = document.getElementById('render-canvas');
        const previewImg = document.getElementById('preview-img');
        
        const btnDownload = document.getElementById('btn-download');
        const btnCopy = document.getElementById('btn-copy');
        const btnShareX = document.getElementById('btn-share-x');
        const btnRestart = document.getElementById('btn-restart');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        // --- Generator Design Theme (Original Field Card) ---
        const t = {
            bg: '#F6F4E8',         // Warm Off-White
            dark: '#0F2922',       // Deep Forest Green
            coral: '#FF5A5F',      // Coral
            yellow: '#FFD166',     // Yellow
            pink: '#D90368'        // Pink Accent
        };

        // --- Canvas Helpers ---
        function drawImageCenterCrop(ctx, img, x, y, w, h) {
            const r = Math.max(w / img.width, h / img.height);
            const nw = img.width * r;
            const nh = img.height * r;
            const cx = (w - nw) / 2;
            const cy = (h - nh) / 2;
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 16);
            ctx.clip();
            ctx.drawImage(img, x + cx, y + cy, nw, nh);
            ctx.restore();
        }

        function drawCornerBracket(ctx, x, y, len, thick, color, rot) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.strokeStyle = color;
            ctx.lineWidth = thick;
            ctx.beginPath();
            ctx.moveTo(len, 0); ctx.lineTo(0, 0); ctx.lineTo(0, len);
            ctx.stroke();
            ctx.restore();
        }

        function drawTechPattern(ctx, x, y, w, color) {
            ctx.fillStyle = color;
            for(let i=0; i<w; i+=8) {
                if(Math.random() > 0.4) {
                    let bw = (Math.random() > 0.5) ? 4 : 12;
                    if(i + bw > w) bw = w - i;
                    ctx.fillRect(x + i, y, bw, 4);
                    i += bw;
                }
            }
        }

        function drawMinimalIcon(ctx, type, x, y, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.translate(x, y);
            
            if (type === 'sun') {
                ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.stroke();
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI/4);
                    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(14, 0); ctx.stroke();
                }
            } else if (type === 'wave') {
                ctx.beginPath(); 
                ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-5, -8, 0, 0); ctx.quadraticCurveTo(5, 8, 10, 0);
                ctx.stroke();
            } else if (type === 'pin') {
                ctx.beginPath(); ctx.arc(0, -5, 5, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-4.5, -3); ctx.lineTo(0, 8); ctx.lineTo(4.5, -3); ctx.stroke();
            }
            ctx.restore();
        }

        // --- Main Render Engine ---
        function renderCanvas() {
            if (!state.imageSrc) return;

            const ctx = canvas.getContext('2d');
            const width = 1080;
            const height = 1350; // 4:5
            
            canvas.width = width;
            canvas.height = height;

            const drawCard = (img) => {
                // 1. Base Cream Background
                ctx.fillStyle = t.bg;
                ctx.fillRect(0, 0, width, height);

                // Subtle Grid/Lines
                ctx.strokeStyle = 'rgba(15, 41, 34, 0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(width, 240); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(600, 240); ctx.lineTo(600, 1150); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 1150); ctx.lineTo(width, 1150); ctx.stroke();

                // Crosshairs
                ctx.strokeStyle = 'rgba(15, 41, 34, 0.2)';
                ctx.beginPath(); ctx.moveTo(50, 40); ctx.lineTo(50, 60); ctx.moveTo(40, 50); ctx.lineTo(60, 50); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(1030, 40); ctx.lineTo(1030, 60); ctx.moveTo(1020, 50); ctx.lineTo(1040, 50); ctx.stroke();

                // 2. Header Section
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                
                // HH GOA 2026
                ctx.font = '900 85px "Inter", sans-serif';
                ctx.fillStyle = t.dark;
                ctx.fillText('HH GOA', 60, 70);
                ctx.fillStyle = t.coral;
                ctx.fillText('2026', 415, 70);
                
                // HACKER HOUSE
                ctx.font = '800 24px "Inter", sans-serif';
                ctx.fillStyle = t.dark;
                ctx.letterSpacing = "6px"; if(ctx.letterSpacing !== undefined) ctx.letterSpacing = "6px";
                ctx.fillText('HACKER HOUSE', 65, 170);
                if(ctx.letterSpacing !== undefined) ctx.letterSpacing = "0px";

                // Right Side Header
                ctx.textAlign = 'right';
                
                ctx.fillStyle = t.dark;
                ctx.fillRect(710, 70, 310, 45);
                ctx.fillStyle = t.bg;
                ctx.font = '800 20px "Inter", sans-serif';
                ctx.fillText('BUILDER FIELD CARD', 1000, 83);
                
                ctx.fillStyle = t.dark;
                ctx.font = 'bold 16px "JetBrains Mono", monospace';
                drawMinimalIcon(ctx, 'pin', 855, 148, t.dark);
                ctx.fillText('GOA / INDIA', 1020, 140);
                
                ctx.fillStyle = t.yellow;
                ctx.font = 'bold 14px "JetBrains Mono", monospace';
                ctx.fillText('BUILDER EDITION', 1020, 175);

                // 3. Main Photo (Hero, Asymmetric Left)
                const pX = 60, pY = 290, pW = 500, pH = 650;
                
                // Deep green shadow
                ctx.fillStyle = t.dark;
                ctx.beginPath(); ctx.roundRect(pX, pY, pW, pH, 16);
                ctx.shadowColor = 'rgba(15, 41, 34, 0.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
                ctx.fill();
                ctx.shadowColor = 'transparent'; // reset

                // Draw Image
                if (img) drawImageCenterCrop(ctx, img, pX, pY, pW, pH);

                // Thin coral offset accent frame
                ctx.strokeStyle = t.coral;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(pX - 12, pY - 12, pW + 24, pH + 24, 20); ctx.stroke();

                // Yellow Corner Brackets
                const cL = 30, cT = 4;
                drawCornerBracket(ctx, pX - 12, pY - 12, cL, cT, t.yellow, 0); 
                drawCornerBracket(ctx, pX + pW + 12, pY - 12, cL, cT, t.yellow, Math.PI/2);
                drawCornerBracket(ctx, pX + pW + 12, pY + pH + 12, cL, cT, t.yellow, Math.PI);
                drawCornerBracket(ctx, pX - 12, pY + pH + 12, cL, cT, t.yellow, -Math.PI/2);

                // 4. Photo Label (Vertical text next to photo)
                ctx.save();
                ctx.translate(35, 940);
                ctx.rotate(-Math.PI/2);
                ctx.fillStyle = t.dark;
                ctx.font = 'bold 12px "JetBrains Mono", monospace';
                ctx.textAlign = 'left';
                ctx.fillText('VERIFIED IMAGE • FIELD ID: ' + state.builderId, 0, 0);
                ctx.restore();

                // 5. Name & Role (Right Side)
                const rX = 640;
                ctx.textAlign = 'left';
                
                ctx.fillStyle = t.coral;
                ctx.font = 'bold 16px "JetBrains Mono", monospace';
                ctx.fillText('BUILDER PROFILE', rX, 300);

                let dName = (state.name || 'BUILDER').toUpperCase();
                ctx.fillStyle = t.dark;
                ctx.font = '900 70px "Inter", sans-serif';
                // wrap/scale logic if name is too long
                if(ctx.measureText(dName).width > 380) ctx.font = '900 50px "Inter", sans-serif';
                ctx.fillText(dName, rX, 330);

                let dRole = (state.role || 'BUILDER').toUpperCase();
                ctx.font = '800 24px "Inter", sans-serif';
                ctx.fillText(dRole, rX, 420);
                
                // Line under role
                ctx.strokeStyle = 'rgba(15, 41, 34, 0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(rX, 470); ctx.lineTo(1020, 470); ctx.stroke();

                // 6. Builder Signature / Technical Area
                ctx.fillStyle = t.dark;
                ctx.font = 'bold 14px "JetBrains Mono", monospace';
                ctx.fillText('BUILDER ID', rX, 520);
                ctx.fillStyle = t.coral;
                ctx.font = '800 24px "JetBrains Mono", monospace';
                ctx.fillText(state.builderId, rX, 550);

                ctx.fillStyle = t.dark;
                ctx.font = 'bold 14px "JetBrains Mono", monospace';
                ctx.fillText('BUILD MODE', rX, 620);
                ctx.font = 'bold 18px "Inter", sans-serif';
                ctx.fillText('BUILD • SHIP • REPEAT', rX, 650);

                // Small Deco Pattern
                drawTechPattern(ctx, rX, 730, 380, t.dark);
                drawTechPattern(ctx, rX, 740, 200, t.coral);

                // Original Deco Element
                ctx.fillStyle = t.dark;
                ctx.font = 'bold 36px "JetBrains Mono", monospace';
                ctx.fillText('</>', rX, 810);
                
                ctx.font = '800 16px "Inter", sans-serif';
                ctx.fillText('GOA', rX + 70, 810);
                ctx.font = '600 14px "JetBrains Mono", monospace';
                ctx.fillText('→ BUILD', rX + 70, 835);
                ctx.fillText('→ SHIP', rX + 70, 855);

                drawMinimalIcon(ctx, 'sun', rX + 160, 815, t.yellow);
                drawMinimalIcon(ctx, 'wave', rX + 160, 845, t.coral);

                // 7. Center Quote / Statement
                ctx.fillStyle = t.dark;
                ctx.fillRect(60, 980, 960, 60);
                ctx.fillStyle = t.bg;
                ctx.font = 'bold 20px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('"BUILD SOMETHING THAT MATTERS."', width/2, 1010);

                // 8. Information Modules Grid
                const modY = 1060;
                const modW = 300;
                const modH = 70;
                const gap = 30;
                
                const mods = [
                    { l: 'STACK', v: (state.stack || 'AI • WEB').toUpperCase() },
                    { l: 'BUILDING', v: (state.building || 'PRODUCTS').toUpperCase() },
                    { l: 'STATUS', v: (state.status || 'READY').toUpperCase() }
                ];

                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                mods.forEach((mod, i) => {
                    let bx = 60 + (modW + gap) * i;
                    ctx.strokeStyle = 'rgba(15, 41, 34, 0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(bx, modY, modW, modH);
                    
                    ctx.fillStyle = t.dark;
                    ctx.font = 'bold 12px "JetBrains Mono", monospace';
                    ctx.fillText(mod.l, bx + 15, modY + 12);
                    
                    ctx.font = '900 18px "Inter", sans-serif';
                    // truncate if needed
                    let v = mod.v;
                    if(ctx.measureText(v).width > modW - 30) ctx.font = '900 14px "Inter", sans-serif';
                    ctx.fillText(v, bx + 15, modY + 35);
                });

                // 9. Footer Panel
                ctx.fillStyle = t.dark;
                ctx.fillRect(0, 1170, width, 180);

                ctx.fillStyle = t.coral;
                ctx.font = '900 48px "Inter", sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText('#FRAMEINGOA', 60, 1260);

                ctx.fillStyle = t.bg;
                ctx.font = '800 24px "Inter", sans-serif';
                ctx.fillText('HH GOA 2026', 460, 1245);
                ctx.font = '600 16px "JetBrains Mono", monospace';
                ctx.fillStyle = 'rgba(246, 244, 232, 0.6)';
                ctx.fillText('HACKER HOUSE', 460, 1275);

                // Right Footer Graphic
                ctx.fillStyle = t.yellow;
                ctx.fillRect(1020 - 180, 1220, 180, 80);
                ctx.fillStyle = t.dark;
                ctx.font = '900 24px "Inter", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GOA / INDIA', 1020 - 90, 1260);

                // Apply to img
                state.previewUrl = canvas.toDataURL('image/png');
                previewImg.src = state.previewUrl;
            };

            const img = new Image();
            img.onload = () => drawCard(img);
            img.src = state.imageSrc;
        }

        // --- UI Interactions ---
        function updateUI() {
            if (state.imageSrc) {
                stateEmpty.classList.add('hidden-force');
                stateSuccess.classList.remove('hidden-force');
                actionsPanel.classList.remove('opacity-40', 'pointer-events-none');
                
                uiPhotoPreview.src = state.imageSrc;
                uiPhotoPreview.classList.remove('hidden-force');
                uploadPlaceholder.classList.add('hidden-force');
                renderCanvas();
            } else {
                stateEmpty.classList.remove('hidden-force');
                stateSuccess.classList.add('hidden-force');
                actionsPanel.classList.add('opacity-40', 'pointer-events-none');
                
                uiPhotoPreview.src = '';
                uiPhotoPreview.classList.add('hidden-force');
                uploadPlaceholder.classList.remove('hidden-force');
            }
        }

        function triggerToast(msg) {
            toastMsg.innerText = msg;
            toast.classList.remove('show');
            void toast.offsetWidth; // force reflow
            toast.classList.add('show');
        }

        // Setup Inputs
        imageUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => { state.imageSrc = ev.target.result; updateUI(); };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Drag and drop support
        const dropZone = document.getElementById('upload-zone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-[#FFD166]', 'bg-[#1F3F30]/40');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-[#FFD166]', 'bg-[#1F3F30]/40');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-[#FFD166]', 'bg-[#1F3F30]/40');
            if (e.dataTransfer.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => { state.imageSrc = ev.target.result; updateUI(); };
                reader.readAsDataURL(e.dataTransfer.files[0]);
            }
        });
        
        // Enter key for upload
        dropZone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); imageUpload.click(); }
        });

        const sync = (id, prop) => {
            const el = document.getElementById(id);
            if(el) {
                el.value = state[prop] || ''; // set default in UI
                el.addEventListener('input', e => { state[prop] = e.target.value; updateUI(); });
            }
        };

        sync('name-input', 'name');
        sync('role-input', 'role');
        sync('stack-input', 'stack');
        sync('building-input', 'building');
        sync('status-input', 'status');

        // Actions
        btnRestart.addEventListener('click', () => {
            state.imageSrc = null;
            state.previewUrl = '';
            imageUpload.value = '';
            
            // Reset fields to defaults
            state.name = 'SWAPNIL';
            state.role = 'AI / ML BUILDER';
            state.stack = 'AI • WEB • PYTHON';
            state.building = 'PRODUCTS';
            state.status = 'READY TO SHIP';
            
            document.getElementById('name-input').value = state.name;
            document.getElementById('role-input').value = state.role;
            document.getElementById('stack-input').value = state.stack;
            document.getElementById('building-input').value = state.building;
            document.getElementById('status-input').value = state.status;
            
            updateUI();
        });

        btnDownload.addEventListener('click', () => {
            if (!state.previewUrl) return;
            const a = document.createElement('a');
            a.download = `hh-goa-2026-builder-card.png`;
            a.href = state.previewUrl;
            a.click();
        });

        btnCopy.addEventListener('click', async () => {
            if (!state.previewUrl) return;
            try {
                canvas.toBlob(async (blob) => {
                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        triggerToast('Image copied to clipboard! 📋');
                    } catch (err) {
                        triggerToast("Image copying isn't supported in this browser. Please use Download PNG.");
                    }
                }, 'image/png');
            } catch (err) {
                triggerToast('Error generating image for clipboard.');
            }
        });

        btnShareX.addEventListener('click', () => {
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(SHARE_TEXT)}`, '_blank');
        });

        // Initialize empty state
        updateUI();

    </script>
</body>
</html>
